<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Xưởng Video TikTok Affiliate</title>
  <style>
    :root {
      --brand: #7A1016;
      --brand-dark: #52090D;
      --brand-soft: #9E1B22;
      --cream: #F5E6D3;
      --bg: #F3F4F6;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(122, 16, 22, 0.12), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(158, 27, 34, 0.10), transparent 45%),
        #F6F5F3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .login-shell {
      width: 100%;
      max-width: 430px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(17, 24, 39, 0.10), 0 1px 3px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid rgba(122, 16, 22, 0.10);
    }

    .login-banner {
      background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 60%, var(--brand-soft) 100%);
      color: #fff;
      padding: 28px 28px 24px;
      text-align: center;
      border-bottom: 4px solid var(--cream);
    }

    .logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .login-banner h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .login-banner p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 5px;
    }

    .login-body {
      padding: 28px;
    }

    .hint-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      margin-bottom: 18px;
      line-height: 1.45;
      display: none;
    }

    .error-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 11px 42px 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14.5px;
      transition: all 0.15s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(122, 16, 22, 0.12);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      padding: 4px;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 13px;
      color: #4B5563;
    }

    .remember-row label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-soft) 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 6px 16px rgba(122, 16, 22, 0.25);
    }

    .btn-login:hover {
      box-shadow: 0 8px 22px rgba(122, 16, 22, 0.34);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .login-footer {
      text-align: center;
      padding: 14px 24px 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-banner">
      <div class="logo-circle">🎬</div>
      <h1>Xưởng Video TikTok Affiliate</h1>
      <p>Đăng nhập để quản lý kịch bản &amp; sản xuất video tự động</p>
    </div>

    <form class="login-body" id="loginForm" onsubmit="submitLogin(event)">
      <div id="localHintBox" class="hint-box">
        💡 <strong>Máy cá nhân lần đầu:</strong> Tài khoản mặc định là <code>admin</code> · Mật khẩu <code>123456</code> (bạn có thể đổi lại sau khi đăng nhập).
      </div>

      <div id="errorBox" class="error-box"></div>

      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" value="admin" autocomplete="username" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu quản trị..." autocomplete="current-password" required autofocus />
          <button type="button" class="toggle-pw" onclick="togglePw()" title="Hiện / Ẩn mật khẩu">👁</button>
        </div>
      </div>

      <div class="remember-row">
        <label>
          <input type="checkbox" id="remember" checked />
          <span>Duy trì đăng nhập 30 ngày</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="btnSubmit">Đăng nhập vào Xưởng Video →</button>
    </form>

    <div class="login-footer">
      Phiên bản 1.5 · Bảo mật phiên Cookie HttpOnly
    </div>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById("password");
      inp.type = inp.type === "password" ? "text" : "password";
    }

    async function loadLoginInfo() {
      try {
        const r = await fetch("/api/auth/info");
        if (!r.ok) return;
        const d = await r.json();
        if (d.default_username) {
          document.getElementById("username").value = d.default_username;
        }
        if (d.show_local_hint) {
          document.getElementById("localHintBox").style.display = "block";
        }
      } catch (_) {}
    }

    async function submitLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const errBox = document.getElementById("errorBox");
      errBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Đang kiểm tra...";

      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            remember: document.getElementById("remember").checked,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.error || "Đăng nhập thất bại.");
        }
        window.location.href = "/";
      } catch (err) {
        errBox.textContent = "⚠ " + err.message;
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Đăng nhập vào Xưởng Video →";
      }
    }

    loadLoginInfo();
  </script>
</body>
</html>
